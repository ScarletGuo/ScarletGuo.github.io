<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

  <link rel="icon" href="{{ '/images/profile-sm.png' | relative_url }}">
  {% feed_meta %}

  <script>
    // Browsers restore the previous scroll offset when navigating between pages,
    // so arriving at /publications/ from the foot of the home page would land you
    // mid-list. Opt out — but leave it alone when the URL carries an anchor.
    if (!location.hash) {
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      addEventListener("pageshow", function () { scrollTo(0, 0); });
    }

    // The email address is stored ROT13'd, so the plain string appears nowhere in
    // the served HTML — address-harvesting crawlers scrape mailto: links and
    // anything shaped like an address, and they do not run this. Decoded on load,
    // which costs a real visitor nothing.
    addEventListener("DOMContentLoaded", function () {
      var el = document.querySelector(".js-email");
      if (!el) return;
      el.href = "mailto:" + el.getAttribute("data-a").replace(/[a-zA-Z]/g, function (c) {
        return String.fromCharCode((c <= "Z" ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26);
      });
    });
  </script>
</head>
<body>

<div class="shell">
  {% include profile.html %}

  <main class="main">
    {% if page.show_title %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
    {{ content }}
  </main>
</div>

</body>
</html>
