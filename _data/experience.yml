# Work, research and teaching history.
#
# Fields:
#   role      required — job title
#   org       required — organisation name (this is the linked part)
#   url       optional — where org links to
#   team      optional — appended after org, e.g. ", Database"
#   place     optional — city, state
#   when      required — shown in the left gutter, e.g. "2023 —", "2018–23"
#   logo      optional — filename in /images/logo/small/
#   selected  optional — true puts it in "Selected Experience" on the home page
